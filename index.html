<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102940"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Kertomestari – demo</title>
<style>
:root{color-scheme:dark;--bg:#102940;--panel:#1b3a50;--line:#36596d;--text:#f5fafb;--muted:#b7ced9;--mint:#99ebbc;--gold:#ffdb79;--blue:#a6dbff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#2d5367 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:default}main{max-width:460px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.brand{font-size:22px;letter-spacing:-.6px;font-weight:900}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}.plain{border:1px solid var(--line);border-radius:12px;background:transparent;padding:10px 14px;min-height:44px;font-size:14px}.progress{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}.track{height:8px;background:#34536a;border-radius:10px;overflow:hidden}.track div{height:100%;background:var(--mint);border-radius:10px;transition:width .25s}.animals{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:13px 0 16px}.animal{border:1px solid var(--line);border-radius:12px;background:#1a354b;text-align:center;padding:5px 0;font-size:11px;color:var(--muted);line-height:1.3}.animal span{display:block;font-size:22px;margin-bottom:3px}.animal.active{border-color:var(--gold);background:#304c5f}.animal.done{background:#214f46;color:var(--mint);border-color:#4b8d73}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:19px;box-shadow:0 16px 40px #071b2b45}h1,h2,p{margin:0}h1{font-size:30px;line-height:1.14;letter-spacing:-.8px}h2{font-size:22px;line-height:1.2;letter-spacing:-.4px}p{color:var(--muted);margin-top:10px}.center{text-align:center}.mascot{font-size:57px;line-height:1.2;margin:0 0 7px}.primary{background:var(--mint);color:#10362c;border:0;border-radius:15px;font-size:18px;font-weight:850;min-height:54px;padding:12px;width:100%;margin-top:16px;box-shadow:0 4px 0 #499b77}.secondary{background:#284b61;border:1px solid #4d6880;border-radius:13px;min-height:46px;padding:9px 14px;font-weight:700;width:100%;margin-top:12px}.equation{font-size:clamp(36px,10vw,49px);font-weight:900;letter-spacing:-1.5px;line-height:1.15;margin:10px 0 12px;font-variant-numeric:tabular-nums}.answer{background:#10283c;border:2px solid #7299ad;border-radius:14px;min-height:60px;display:flex;justify-content:center;align-items:center;font-size:36px;font-weight:850;margin:4px 0 12px;color:var(--gold)}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.key{background:#2b4e64;border:1px solid #527188;border-radius:11px;min-height:48px;font-weight:800;font-size:24px;box-shadow:0 2px 0 #10283c}.key:active,.primary:active{transform:translateY(2px);box-shadow:none}.key.special{color:var(--gold);font-size:19px}.hint{border:1px solid #887448;background:#3c4447;color:#fff0bb;padding:12px;border-radius:13px;margin:12px 0;text-align:left;font-size:15px}.hint b{color:var(--gold)}.visual{margin:15px 0;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.digit{background:var(--gold);color:#433213;font-size:35px;font-weight:900;border-radius:12px;width:52px;min-height:56px;display:grid;place-items:center}.digit:nth-child(n+3){background:var(--blue);color:#123b5b}.squares{display:grid;gap:4px;grid-template-columns:repeat(var(--cols),minmax(0,1fr));width:min(100%,225px);margin:14px auto}.square{aspect-ratio:1;border-radius:3px;background:var(--blue)}.square.alt{background:var(--gold)}.chess:nth-child(odd){background:#f4dbb4}.chess:nth-child(even){background:#536a85}.week{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:10px auto}.week b{border:1px solid #5b8c9f;background:#24465b;border-radius:8px;padding:6px;color:var(--blue);font-size:13px}.small{font-size:13px;color:var(--muted)}.result{color:var(--mint)}.warn{color:var(--gold)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat strong{display:block;font-size:29px;color:var(--mint)}footer{text-align:center;margin-top:17px;color:var(--muted);font-size:11px}.footbutton{background:none;border:0;color:var(--muted);text-decoration:underline;padding:9px;font-size:12px}.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.item:last-child{border-bottom:none}.mark{font-size:12px;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-height:730px){main{padding-top:10px}.panel{padding:14px}.mascot{font-size:43px}.key{min-height:44px}.animals{margin:9px 0}.equation{margin:6px 0}.answer{min-height:48px;font-size:30px}.primary{min-height:48px;margin-top:12px}}
</style></head><body><main><header><div><div class="eyebrow">Pieni matikkaseikkailu</div><div class="brand">✦ Kertomestari</div></div><button class="plain" id="parent">Edistyminen</button></header><div class="progress"><span id="progressLabel">Seikkailu alkaa</span><span id="progressNumber">0 / 6</span></div><div class="track"><div id="bar" style="width:0%"></div></div><div class="animals" id="animals"></div><section class="panel" id="screen" aria-live="polite"></section><footer>Harjoitusdemo · 6 kertolaskua · Ei mainoksia tai kirjautumista<br><button class="footbutton" id="reset">Aloita demo alusta</button><span id="storageNote"></span></footer></main>
<script>
'use strict';
const facts=[{a:7,b:8,e:'🐉',n:'Lohikäärme',title:'Neljä numeroa jonossa',hint:'Viisi, kuusi, seitsemän, kahdeksan! 56 = 7 × 8.',kind:'digits'},{a:6,b:7,e:'🦊',n:'Kettu',title:'Viisi ryhmää ja yksi lisää',hint:'5 × 7 = 35. Lisää 7: saat 42.',kind:'array',split:5},{a:8,b:8,e:'🦉',n:'Pöllö',title:'Taianomainen shakkilauta',hint:'Shakkilaudalla on 8 riviä ja 8 ruutua jokaisella rivillä. Yhteensä 64.',kind:'chess'},{a:7,b:7,e:'🐼',n:'Panda',title:'Seitsemän viikon seikkailu',hint:'Viikossa on 7 päivää. Seitsemässä viikossa on 49 päivää.',kind:'weeks'},{a:6,b:8,e:'🐙',n:'Mustekala',title:'Viisi ryhmää ja yksi lisää',hint:'5 × 8 = 40. Lisää 8: saat 48.',kind:'array',split:5},{a:9,b:7,e:'🦁',n:'Leijona',title:'Kymmenestä yksi pois',hint:'10 × 7 = 70. Ota 7 pois: jäljelle jää 63.',kind:'minus'}];
const key='kertomestari-demo-v1';const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const initial=()=>({items:facts.map(()=>({streak:0,seen:false,attempts:0,right:0,review:null,learnedDay:null,retained:false})),queue:facts.map((_,i)=>i),attempts:0,day:today(),practice:false});let saved=true,s;try{s=JSON.parse(localStorage.getItem(key))||initial();if(s.items?.length!==facts.length||!Array.isArray(s.queue))s=initial()}catch(e){s=initial();saved=false}let mode='home',answer='',help=false,last='',reverse=false,prior='home';
function persist(){try{localStorage.setItem(key,JSON.stringify(s));saved=true}catch(e){saved=false} $('storageNote').textContent=saved?'':' · Tallennus ei ole käytettävissä tässä selaimessa.'}
function startDay(){if(s.day!==today()){s.day=today();s.practice=false;const due=s.items.map((x,i)=>({x,i})).filter(({x})=>x.streak<2||(x.review&&x.review<=today())).map(({i})=>i);s.queue=due;for(const i of due){const x=s.items[i];if(x.streak>=2){x.streak=0;x.retained=false}}persist()}}
startDay();persist();const current=()=>s.queue[0];const item=()=>s.items[current()];const fact=()=>facts[current()];const count=()=>s.items.filter(x=>x.streak>=2).length;
function visual(f){if(f.kind==='digits')return '<div class="visual" aria-label="5 6 7 8">'+[5,6,7,8].map(n=>`<span class="digit">${n}</span>`).join('')+'</div>';if(f.kind==='weeks')return '<div class="week">'+Array.from({length:7},(_,i)=>`<b>Vko ${i+1}<br>7 pv</b>`).join('')+'</div>';if(f.kind==='minus')return '<div class="equation" style="font-size:30px;color:var(--gold)">70 − 7 = 63</div>';const chess=f.kind==='chess';return `<div role="img" aria-label="${f.a} riviä, ${f.b} ruutua rivissä" class="squares" style="--cols:${f.b}">`+Array.from({length:f.a*f.b},(_,i)=>`<span class="square ${chess?'chess':Math.floor(i/f.b)>=f.split?'alt':''}" ${chess?`style="background:${(Math.floor(i/f.b)+i%f.b)%2?'#536a85':'#f4dbb4'}"`:''}></span>`).join('')+'</div>'}
function renderHeader(){let n=count();$('progressLabel').textContent='Kahdesti ilman vihjettä';$('progressNumber').textContent=n+' / '+facts.length;$('bar').style.width=n/facts.length*100+'%';$('animals').innerHTML=facts.map((f,i)=>`<div class="animal ${s.items[i].streak>=2?'done':''} ${['lesson','quiz','feedback'].includes(mode)&&i===current()?'active':''}"><span>${s.items[i].streak>=2?'⭐':f.e}</span>${f.a}×${f.b}</div>`).join('')}
const btn=(t,id='next',cls='primary')=>`<button class="${cls}" id="${id}">${t}</button>`;
function render(){renderHeader();let html='',f=fact();if(mode==='home'){html=`<div class="center"><div class="mascot">🐉</div><div class="eyebrow">Kuusi taikaeläintä odottaa</div><h1>Opi kertotaulun<br>taikatemput!</h1><p>Vapauta eläimet muistamalla niiden salaiset laskut. Opi ensin niksi, sitten kokeile ilman apua.</p><div class="stats"><div class="stat"><strong>6</strong><span class="small">kertolaskua</span></div><div class="stat"><strong>5 min</strong><span class="small">tavoiteaika</span></div></div>${btn(s.queue.length?'Aloita seikkailu →':'Katso tuloksesi →')}</div>`}
else if(mode==='lesson'){html=`<div class="center"><div class="mascot">${f.e}</div><div class="eyebrow">Opi muistivihje</div><h2>${f.title}</h2>${visual(f)}<div class="equation">${f.a} × ${f.b} = ${f.a*f.b}</div><p>${f.hint}</p>${btn('Kokeilen itse →')}</div>`}
else if(mode==='quiz'){html=`<div class="center"><div class="mascot">${f.e}</div><div class="eyebrow">${item().streak?'Muistatko vielä?':'Ratkaise taikalasku'}</div><div class="equation">${reverse?f.b:f.a} × ${reverse?f.a:f.b} = ?</div><div class="answer" id="answer" aria-label="Vastauksesi" aria-live="off">${answer||'?'}</div>${help?`<div class="hint"><b>💡 Muistivihje</b><br>${f.hint}</div>`:''}<div class="keys">${['1','2','3','4','5','6','7','8','9','💡','0','⌫'].map(k=>`<button class="key ${isNaN(+k)?'special':''}" data-key="${k}" aria-label="${k==='💡'?'Muistivihje':k==='⌫'?'Poista numero':k}">${k}</button>`).join('')}</div><button class="primary" id="check" ${answer?'':'disabled'}>Tarkista vastaus</button></div>`}
else if(mode==='feedback'){const good=last==='correct';html=`<div class="center"><div class="mascot">${good&&item().streak>=2?'🏆':f.e}</div><div class="eyebrow">${good?'Hyvä!':'Harjoittelemalla oppii'}</div><h2 class="${good?'result':'warn'}">${good?(item().streak>=2?'Taikaeläin vapautettu!':'Hienosti muistettu!'):last==='assisted'?'Oikein, vihjeen avulla!':'Ei haittaa – opitaan yhdessä!'}</h2><div class="equation">${f.a} × ${f.b} = ${f.a*f.b}</div>${good?'':visual(f)+`<p>${f.hint}</p>`}<p>${item().streak>=2?'Osasit laskun kahdesti ilman vihjettä. Seuraava tarkistus myöhemmin.':'Sama lasku tulee vielä uudelleen vastaan.'}</p>${btn('Jatka →')}</div>`}
else if(mode==='done'){const learned=count();html=`<div class="center"><div class="mascot">🏆</div><h1>${learned===facts.length?'Kaikki taikaeläimet vapautettu!':'Tämän päivän harjoitus tehty!'}</h1><p>Muistit ${learned} laskua kahdesti ilman vihjettä. Pitkäkestoinen muistaminen varmistuu vasta tulevilla kerroilla.</p><div class="stats"><div class="stat"><strong>${learned}/6</strong><span class="small">laskua harjoiteltu</span></div><div class="stat"><strong>${s.attempts}</strong><span class="small">vastausta yhteensä</span></div></div><div class="hint">🌙 Palaa huomenna kertaamaan. Tämä demo tallentaa edistymisen selaimeen, jos tallennustila on käytettävissä.</div>${btn('Harjoittele uudelleen','practice','secondary')}${btn('Katso edistyminen','showStats')}</div>`}
else if(mode==='stats'){html=`<div class="eyebrow">Vanhemman näkymä</div><h2>Edistyminen</h2><p>Kaksi oikeaa vastausta ilman apua kertoo tämän harjoituksen osaamisesta, ei vielä pysyvästä muistamisesta.</p><div class="stats"><div class="stat"><strong>${count()}/6</strong><span class="small">kahdesti oikein</span></div><div class="stat"><strong>${s.items.filter(x=>x.retained).length}/6</strong><span class="small">muistettu myöhempänä päivänä</span></div></div>${facts.map((f,i)=>{const x=s.items[i];return `<div class="item"><b>${f.e} ${f.a} × ${f.b}</b><span class="mark">${x.streak>=2?(x.retained?'Muistettu myöhemmin':'Kahdesti oikein'):(x.attempts?'Harjoitellaan':'Ei vielä harjoiteltu')}${x.review?' · '+x.review.slice(8)+'.'+x.review.slice(5,7)+'.':''}</span></div>`}).join('')}${btn('Takaisin','back','secondary')}`}
$('screen').innerHTML=html;bind()}
function enter(){answer='';help=false;last='';if(!s.queue.length){mode='done';render();return}reverse=item().streak===1;mode=item().seen?'quiz':'lesson';render()}
function check(){if(mode!=='quiz'||!answer)return;let x=item(),f=fact();const correct=Number(answer)===f.a*f.b;x.attempts++;s.attempts++;if(correct)x.right++;if(correct&&!help){x.streak=Math.min(2,x.streak+1);last='correct';if(x.streak>=2){if(x.learnedDay&&x.learnedDay<today())x.retained=true;x.learnedDay=today();x.review=tomorrow()}}else{x.streak=0;x.retained=false;last=correct?'assisted':'wrong'}mode='feedback';// Keep a resumable queue, including the current item until feedback is acknowledged.
persist();render()}
function next(){if(mode==='home')enter();else if(mode==='lesson'){item().seen=true;mode='quiz';persist();render()}else if(mode==='feedback'){const i=s.queue.shift();if(s.items[i].streak<2)s.queue.push(i);persist();enter()}}
function press(k){if(mode!=='quiz')return;if(k==='💡'){help=true;render();return}if(k==='⌫')answer=answer.slice(0,-1);else if(answer.length<3)answer+=k;$('answer').textContent=answer||'?';$('check').disabled=!answer}
function stats(){prior=mode;mode='stats';render()}
function bind(){if($('next'))$('next').onclick=next;if($('check'))$('check').onclick=check;document.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>press(e.dataset.key));if($('showStats'))$('showStats').onclick=stats;if($('back'))$('back').onclick=()=>{mode=prior;render()};if($('practice'))$('practice').onclick=()=>{s.queue=facts.map((_,i)=>i);s.items.forEach(x=>{x.streak=0});s.practice=true;persist();enter()}}
$('parent').onclick=()=>{if(mode==='stats'){mode=prior;render()}else stats()};$('reset').onclick=()=>{if(!confirm('Aloitetaanko alusta? Tämän demon edistyminen poistetaan.'))return;s=initial();mode='home';persist();render()};document.addEventListener('keydown',e=>{if(mode!=='quiz'||e.altKey||e.ctrlKey||e.metaKey)return;if(/^\d$/.test(e.key)){e.preventDefault();press(e.key)}else if(e.key==='Backspace'){e.preventDefault();press('⌫')}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();check()}});render();
</script></body></html>
